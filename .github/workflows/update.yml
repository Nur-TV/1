          GROUP_MAP = {

              # КИНО
              "IPTVPLAY (Кинозал)": "Кино и сериалы",
              "Кино Online": "Кино и сериалы",
              "Кино и сериалы (Российские)": "Кино и сериалы",
              "Кинозалы": "Кино и сериалы",
              "Кинозалы (VPN)": "Кино и сериалы",
              "Премьеры и хиты": "Кино и сериалы",
              "Сериалы НТВ": "Кино и сериалы",
              "Фильмы и сериалы": "Кино и сериалы",
              "Музыкальные 🎶": "Музыкальные",

              # СПОРТ
              "Спортивные": "Спорт",
              "Спорткомплекс 🏆": "Спорт",

              # НОВОСТИ
              "Новостные": "Новости",

              # ПОЗНАВАТЕЛЬНЫЕ
              "Образовательные": "Познавательные",

              # РАЗВЛЕКАТЕЛЬНЫЕ
              "Развлекательные (Местные)": "Развлекательные",

              # РЕГИОНАЛЬНЫЕ
              "Местные": "Региональные",

              # ОБЩЕСТВЕННЫЕ
              "Общие": "Общественные",

              # WINK
              "Wink (VPN 🇷🇺)": "Разное",
              "Wink и другие часовые пояса": "Разное",

              # СНГ
              "Itv.uz (🇺🇿)": "Узбекистан",

              # TURON ОСТАВЛЯЕМ ОТДЕЛЬНО
              "Turon Media (VPN)": "Turon Media (VPN)",

              # ОТДЕЛЬНЫЕ СТРАНЫ СНГ
              "Азербайджан": "Азербайджан",
              "Армения": "Армения",
              "Беларусь": "Беларусь",
              "Казахстан": "Казахстан",
              "Кыргызстан": "Кыргызстан",
              "Молдавия": "Молдавия",
              "Таджикистан": "Таджикистан",
              "Туркменистан": "Туркменистан",
              "Узбекистан": "Узбекистан",

              # НЕ СНГ
              "Индия": "Индия",
              "Грузия": "Грузия",
              "Турция": "Турция",

              # ВЗРОСЛЫЕ
              "Эротика": "Взрослые",
          }


          # ============================================================
          # СТРАННЫЕ / ТЕХНИЧЕСКИЕ ГРУППЫ -> РАЗНОЕ
          # ============================================================

          MISC_GROUPS = {
              "StarNet (VPN 🇳🇱)",
              "Сириус",
              "Vivacom BG",
              "NNT",
              "Oracle Corporation",
              "Cloud_Flare",
              "Cloudflare_Inc!",
              "Инет",
              "Internet42 LLC",
              "📺 Usba TV",
              "RELAX🏝️",
              "С сайтов",
              "С сайтов (VPN)",
              "Современные сетевые технологии (VPN)",
              "Цитадель-Крым (VPN)",
              "Lime (VPN 🇷🇺)",
              "Большое ТВ (VPN)",
              "Rutube (VPN)",
              "Виктория (VPN 🇷🇺)",
              "Квант-Телеком (VPN 🇷🇺)",
              "Webhost (VPN 🇷🇺)",
              "Телевизор 24 (VPN)",
              "↕️ Торрент ТВ ↕️",
              "Подборка каналов с интернета",
              "Подборка",
          }


          # ============================================================
          # ПОРЯДОК ГРУПП
          # ============================================================

          GROUP_ORDER = [
              "Федеральные",
              "Развлекательные",
              "Кино и сериалы",
              "Детские",
              "Музыкальные",
              "Спорт",
              "Познавательные",
              "Новости",
              "Региональные",
              "Эфирные",
              "Религиозные",
              "Общественные",
              "Мужские",
              "Досуг",
              "Культура",
              "Христианские",
              "Хобби и увлечения",
              "Медитативные",
              "Радио",
              "Беларусь",
              "Казахстан",
              "Узбекистан",
              "Азербайджан",
              "Армения",
              "Грузия",
              "Кыргызстан",
              "Молдавия",
              "Таджикистан",
              "Туркменистан",
              "Турция",
              "Индия",
              "Австралия",
              "Австрия",
              "Азия",
              "Албания",
              "Арабские",
              "Аргентина",
              "Африка",
              "Болгария",
              "Бразилия",
              "Великобритания",
              "Венгрия",
              "Германия",
              "Греция",
              "Израиль",
              "Иран",
              "Испания",
              "Италия",
              "Канада",
              "Латинская Америка",
              "Мексика",
              "Нидерланды",
              "Остальная Европа",
              "Польша",
              "Португалия",
              "Румыния",
              "Сербия",
              "Словакия",
              "США",
              "Франция",
              "Хорватия",
              "Чехия",
              "Разное",
              "Без категории",
              "Взрослые",
          ]


          # ============================================================
          # ============================================================
          # ОЧЕВИДНЫЕ ВЗРОСЛЫЕ КАНАЛЫ
          # ============================================================

          ADULT_WORDS = [
              "porn",
              "porno",
              "xxx",
              "erotic",
              "erotica",
              "adult",
              "playboy",
              "penthouse",
              "brazzers",
              "hustler",
              "dorcel",
              "private",
              "passion xxx",
              "18+",
              "взросл",
              "xteen",
              "sexture",
              "adultip",
              "порно",
              "эрот",
              "порн",
          ]


          # ============================================================
          # ПОЛУЧЕНИЕ ГРУППЫ
          # ============================================================

          def get_group(info):

              match = re.search(
                  r'group-title="([^"]*)"',
                  info,
                  flags=re.IGNORECASE
              )

              if match:
                  return match.group(1).strip()

              return ""


          def set_group(info, group):

              if re.search(
                  r'group-title="[^"]*"',
                  info,
                  flags=re.IGNORECASE
              ):
                  return re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{group}"',
                      info,
                      flags=re.IGNORECASE
                  )

              comma = info.find(",")
              if comma >= 0:
                  return info[:comma] + f' group-title="{group}"' + info[comma:]

              return info


          def is_adult(info, group):

              if group.strip().lower() in {"взрослые", "эротика", "18+"}:
                  return True

              text = (
                  info
                  + " "
                  + group
              ).lower()

              return any(
                  word in text
                  for word in ADULT_WORDS
              )




          # ============================================================
          # ОТДЕЛЬНЫЕ ФАЙЛЫ / ЗАПИСИ, А НЕ ЛИНЕЙНЫЕ КАНАЛЫ
          # ============================================================

          def is_recording(info, url, group):

              # Все записи вне 18+ исключаем. Линейные телеканалы
              # с фильмами, мультфильмами и музыкой остаются.
              if is_adult(info, group):
                  return False

              path = url.split("?", 1)[0].lower()
              return bool(re.search(
                  r"\.(mp4|mkv|avi|mov|mp3|m4v|webm|flv|wmv|mpg|mpeg|m4a|aac|flac)$",
                  path
              ))


          def is_restricted_stream(url):

              # Явные DRM/учётные данные не включаем в бесплатный M3U.
              return bool(re.search(
                  r"(?:mdrm|access_token=|username=|password=|(?:[?&])cid=|(?:[?&])did=)",
                  url,
                  flags=re.IGNORECASE
              ))


          def classify_channel(info, group, url):

              if is_adult(info, group):
                  return "Взрослые"

              comma = info.find(",")
              name = info[comma + 1:].strip().lower() if comma >= 0 else info.lower()

              technical_groups = {
                  "Разное", "Без категории", "",
                  "Turon Media (VPN)", "Datacamp Limited",
                  "Велком", "LLC G&G-Telecom", "Наш Нет 🇺🇦",
                  "Оргтехсервис (VPN)", "Uplink (VPN)",
                  "Кинозалы 🍿 (VPN)", "Сити Эдем"
              }

              if group not in technical_groups:
                  return group

              rules = [
                  ("Новости", r"новост|известия|\brbc\b|\brt\b|россия\s*24|мир\s*24|euronews|bbc|cnn|cnbc|news\s*live|тасс|соловьев|первый информац|осн|инфо\s*24"),
                  ("Спорт", r"sport|спорт|eurosport|матч|football|футбол|fifa|ufc|boxing|бокс|теннис|fight"),
                  ("Детские", r"мульт|cartoon|kids|disney|nickelodeon|\bnick\b|карусел|детск|baby|gulli|аниме|animax|союзмульт"),
                  ("Музыкальные", r"music|музык|mtv|ru\.tv|bridge|музтв|шансон|шлягер|retro.?music|muz|hit.?tv|tmtv"),
                  ("Кино и сериалы", r"кино|film|movie|serial|сериал|фильм|cinema|viju|vip.?serial|kinomix|кинопоказ|mosfilm|дом.?кино|еврокино|кинокомед|кинопрем|киносвид|киносем|кинохит|кинопанорам"),
                  ("Познавательные", r"наука|планета|animal|discovery|history|nat.?geo|national.?geographic|travel|познав|история|охота|рыбалка|географ|животн|wild"),
                  ("Религиозные", r"спас|союз|церков|православ|религи|благовест|три.?ангела|радость.?моя|angel"),
                  ("Развлекательные", r"развлек|пятниц|суббота|домашний|супер|\bче\b|\bю\b|sts|тнт|тв3|2x2|перец|сарафан|стс|комеди|юмор|про бизнес"),
                  ("Региональные", r"\b24\b|губерн|городск|област|край|регион|репортер|репортёр|барс|вектор|ветта|телевидение|телеканал|град|местный|псков|астрахан|краснодар|сургут|катунь|мордов|лен тв|север|белгород|брянск|кубань|кузбасс|енисей|крик|рифей|столица|доверие|волгоград|камчат|дагестан|осетия|магас|саха|губерния"),
              ]

              for target, pattern in rules:
                  if re.search(pattern, name, flags=re.IGNORECASE):
                      return target

              if re.search(r"radio|радио", name, flags=re.IGNORECASE):
                  return "Радио"

              return "Разное"


          # ============================================================
          # СКАЧИВАНИЕ
          # ============================================================

          def download_playlist(url):

              for attempt in range(3):

                  try:

                      response = requests.get(
                          url,
                          headers={
                              "User-Agent":
                                  "Mozilla/5.0 IPTV Builder"
                          },
                          timeout=(15, 60),
                          allow_redirects=True
                      )

                      if (
                          response.status_code == 200
                          and len(response.text) > 20
                          and "#EXTINF" in response.text
                      ):

                          print(
                              f"SOURCE OK: {url}"
                          )

                          return response.text

                      print(
                          f"SOURCE STATUS "
                          f"{response.status_code}: "
                          f"{url}"
                      )

                  except Exception as error:

                      print(
                          f"SOURCE ERROR "
                          f"{attempt + 1}/3: "
                          f"{url} -> {error}"
                      )

                  time.sleep(2)

              return ""


          # ============================================================
          # РАЗБОР M3U
          # ============================================================

          def extract_entries(text):

              lines = (
                  text
                  .replace("\r\n", "\n")
                  .replace("\r", "\n")
                  .split("\n")
              )

              entries = []

              current_info = None

              for line in lines:

                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF:"):

                      current_info = line

                      continue

                  if line.startswith("#"):

                      continue

                  if (
                      current_info
                      and (
                          line.startswith("http://")
                          or line.startswith("https://")
                          or line.startswith("rtmp://")
                      )
                  ):

                      entries.append(
                          (
                              current_info,
                              line
                          )
                      )

                      current_info = None

              return entries


          # ============================================================
          # ПРОВЕРКА РЕАЛЬНОГО МЕДИАПОТОКА
          #
          # ВАЖНО:
          #
          # HTTP 200 больше НЕ считается достаточным.
          #
          # Используем ffprobe.
          #
          # ffprobe должен увидеть настоящий медиапоток.
          # ============================================================

          def probe_stream(item):

              info, url = item

              command = [
                  "ffprobe",

                  "-v",
                  "error",

                  "-hide_banner",

                  "-user_agent",
                  "VLC/3.0.20",

                  "-rw_timeout",
                  "10000000",

                  "-analyzeduration",
                  "8000000",

                  "-probesize",
                  "5000000",

                  "-show_entries",
                  "stream=codec_type",

                  "-of",
                  "csv=p=0",

                  url
              ]

              for attempt in range(3):

                  try:

                      result = subprocess.run(
                          command,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          text=True,
                          timeout=15
                      )

                      output = (
                          result.stdout
                          or ""
                      ).lower()

                      # ------------------------------------------------
                      # Настоящий поток найден
                      # ------------------------------------------------

                      if (
                          result.returncode == 0
                          and (
                              "video" in output
                              or "audio" in output
                          )
                      ):

                          return True, item

                      time.sleep(1.5)

                  except subprocess.TimeoutExpired:

                      if attempt < 2:
                          continue

                  except Exception:

                      if attempt < 2:
                          continue

              return False, item


          # ============================================================
          # ЗАГРУЖАЕМ ИСТОЧНИКИ
          # ============================================================

          print("")
          print("======================================")
          print("DOWNLOADING IPTV SOURCES")
          print("======================================")

          all_entries = []

          for source in SOURCES:

              text = download_playlist(source)

              if not text:

                  print(
                      f"SOURCE FAILED: {source}"
                  )

                  continue

              entries = extract_entries(text)

              print(
                  f"{source} -> "
                  f"{len(entries)} entries"
              )

              for info, url in entries:

                  original_group = get_group(info)
                  if source in ADULT_SOURCES:
                      original_group = "Взрослые"

                  # Удаляем только отдельные файлы с записями. Линейные
                  # кино-, детские и музыкальные телеканалы сохраняются.
                  if is_recording(info, url, original_group) or is_restricted_stream(url):
                      continue

                  # ----------------------------------------------------
                  # Удаление
                  # ----------------------------------------------------

                  if original_group in DELETE_GROUPS:

                      continue

                  # ----------------------------------------------------
                  # Странные технические группы
                  # ----------------------------------------------------

                  if original_group in MISC_GROUPS:

                      new_group = "Разное"

                  else:

                      new_group = GROUP_MAP.get(
                          original_group,
                          original_group
                      )

                  # ----------------------------------------------------
                  # Пустая группа
                  # ----------------------------------------------------

                  if not new_group:

                      new_group = "Без категории"

                  # ----------------------------------------------------
                  # Взрослые
                  # ----------------------------------------------------

                  if is_adult(
                      info,
                      original_group
                  ):

                      new_group = "Взрослые"

                  # ----------------------------------------------------
                  # Раскладываем каналы из технических групп по тематике
                  # ----------------------------------------------------
                  new_group = classify_channel(info, new_group, url)

                  # ----------------------------------------------------
                  # Устанавливаем группу
                  # ----------------------------------------------------

                  info = set_group(
                      info,
                      new_group
                  )

                  # ----------------------------------------------------
                  # ДУБЛИКАТЫ НЕ УДАЛЯЕМ
                  # ----------------------------------------------------

                  all_entries.append(
                      (
                          info,
                          url
                      )
                  )


          if not all_entries:
              raise RuntimeError("No IPTV entries downloaded; refusing to overwrite playlist.")

          print("")
          print(
              f"TOTAL BEFORE CHECK: "
              f"{len(all_entries)}"
          )


          # ============================================================
          # ГЛУБОКАЯ ПРОВЕРКА
          # ============================================================

          print("")
          print("======================================")
          print("REAL MEDIA STREAM CHECK")
          print("======================================")

          working = []

          # 25 одновременных проверок.
          #
          # Это значительно безопаснее для источников,
          # чем 50+ одновременных соединений.
          #
          # При этом процесс всё равно будет параллельным.

          MAX_WORKERS = 25

          with ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:

              futures = [
                  executor.submit(
                      probe_stream,
                      entry
                  )
                  for entry in all_entries
              ]

              total = len(futures)

              for number, future in enumerate(
                  as_completed(futures),
                  1
              ):

                  try:

                      ok, entry = future.result()

                      if ok:

                          working.append(entry)

                  except Exception:

                      pass

                  if number % 100 == 0:

                      print(
                          f"CHECKED: "
                          f"{number}/{total} | "
                          f"WORKING: "
                          f"{len(working)}"
                      )


          if not working:
              raise RuntimeError("No playable streams passed ffprobe; refusing to overwrite playlist.")

          print("")
          print(
              f"WORKING STREAMS: "
              f"{len(working)}"
          )


          # ============================================================
          # СОБИРАЕМ ГРУППЫ
          # ============================================================

          grouped = {}

          for info, url in working:

              group = get_group(info)

              if not group:

                  group = "Без категории"

              grouped.setdefault(
                  group,
                  []
              ).append(
                  (
                      info,
                      url
                  )
              )


          # ============================================================
          # ФОРМИРУЕМ ФИНАЛЬНЫЙ ПОРЯДОК
          # ============================================================

          ordered_groups = []

          # Сначала группы из GROUP_ORDER

          for group in GROUP_ORDER:

              if group in grouped:

                  ordered_groups.append(
                      group
                  )


          # Затем любые новые неизвестные группы,
          # чтобы ничего случайно не потерять.

          for group in grouped:

              if group not in ordered_groups:

                  ordered_groups.append(
                      group
                  )


          print("")
          print("======================================")
          print("FINAL GROUP ORDER")
          print("======================================")


          for number, group in enumerate(
              ordered_groups,
              1
          ):

              print(
                  f"{number}. {group}"
              )


          # ============================================================
          # СОХРАНЕНИЕ СПИСКА ГРУПП
          # ============================================================

          with open(
              "groups.txt",
              "w",
              encoding="utf-8"
          ) as file:

              file.write("NUR-TV — СПИСОК ГРУПП IPTV\n")
              file.write("================================\n")
              file.write(f"Всего каналов: {len(working)}\n")
              file.write(f"Всего групп: {len(ordered_groups)}\n\n")

              for number, group in enumerate(ordered_groups, 1):
                  file.write(
                      f"{number}. {group} — {len(grouped[group])} каналов\n"
                  )


          # ============================================================
          # СОХРАНЕНИЕ
          # ============================================================

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "#EXTM3U\n"
              )

              for group in ordered_groups:

                  for info, url in grouped[group]:

                      file.write(
                          info + "\n"
                      )

                      file.write(
                          url + "\n"
                      )


          print("")
          print(
              f"PLAYLIST CREATED: "
              f"{OUTPUT}"
          )

          PY

      - name: Build playlist
        run: |
          python build_playlist.py

      - name: Commit updated playlist
        run: |
          git config user.name "IPTV Bot"
          git config user.email "actions@users.noreply.github.com"

          git add playlist.m3u groups.txt

          if git diff --cached --quiet; then
            echo "No playlist changes."
            exit 0
          fi

          git commit -m "Deep check IPTV streams and update playlist"

          # EPG может обновиться, пока идёт длительная проверка потоков.
          # Перед push подтягиваем новый коммит и повторяем попытку при гонке.
          for attempt in 1 2 3; do
            git pull --rebase origin main

            if git push origin main; then
              echo "Playlist successfully pushed."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; trying again..."
            sleep 5
          done

          echo "Could not push playlist after 3 attempts."
          exit 1
