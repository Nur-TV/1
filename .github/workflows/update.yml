name: Update IPTV playlist (temporarily paused)

# Автоматическая сборка временно отключена.
# Старый импорт источников нельзя запускать повторно до завершения аудита
# и замены фильтрации медиатек на проверенную логику.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Playlist build is paused
        run: echo "Playlist publishing is paused until source audit and safe rebuild are complete."
