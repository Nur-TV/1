name: Analyze IPTV groups

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Analyze groups
        run: |
          cat > analyze_groups.py <<'PY'
          import re
          import requests
          from collections import Counter

          SOURCES = [
              "https://raw.githubusercontent.com/IPTVSHARED/VeronaTV/refs/heads/main/VeronaTV.m3u",
              "https://raw.githubusercontent.com/Dimonovich/TV/Dimonovich/FREE/TV",
              "https://spirt007.github.io/Tvru/Rus.m3u",
              "https://iptv.axenov.dev/so",
              "https://loganet.vercel.app/LoganetXStrawberry.m3u",
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 IPTV Group Analyzer"
          })

          groups = Counter()
          total_channels = 0

          for source in SOURCES:
              print(f"\nDownloading: {source}")

              try:
                  r = session.get(source, timeout=60)
                  r.raise_for_status()
                  text = r.text

                  count = 0

                  for line in text.splitlines():
                      line = line.strip()

                      if line.startswith("#EXTINF:"):
                          count += 1

                          match = re.search(
                              r'group-title="([^"]*)"',
                              line,
                              re.IGNORECASE
                          )

                          if match:
                              group = match.group(1).strip()

                              if group:
                                  groups[group] += 1
                              else:
                                  groups["[БЕЗ ГРУППЫ]"] += 1
                          else:
                              groups["[БЕЗ ГРУППЫ]"] += 1

                  total_channels += count
                  print(f"Channels: {count}")

              except Exception as e:
                  print(f"ERROR: {e}")

          print(f"\nTOTAL CHANNELS: {total_channels}")
          print(f"TOTAL GROUPS: {len(groups)}")

          with open("groups.txt", "w", encoding="utf-8") as f:
              f.write("СПИСОК ГРУПП IPTV\n")
              f.write("=================\n\n")
              f.write(f"Всего каналов: {total_channels}\n")
              f.write(f"Всего групп: {len(groups)}\n\n")

              for number, (group, count) in enumerate(
                  sorted(groups.items(), key=lambda x: x[0].lower()),
                  1
              ):
                  f.write(f"{number}. {group} — {count} каналов\n")

          print("\nSaved groups.txt")
          PY

          python analyze_groups.py

      - name: Commit groups list
        run: |
          git config user.name "IPTV Bot"
          git config user.email "actions@users.noreply.github.com"

          git add groups.txt

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Analyze IPTV groups"
            git push
          fi
