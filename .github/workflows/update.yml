name: Update IPTV playlist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3,15 * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create IPTV processor
        run: |
          cat > build_playlist.py <<'PY'
          import re
          import time
          import requests
          from concurrent.futures import ThreadPoolExecutor, as_completed

          SOURCES = [
              "https://raw.githubusercontent.com/IPTVSHARED/VeronaTV/refs/heads/main/VeronaTV.m3u",
              "https://raw.githubusercontent.com/Dimonovich/TV/Dimonovich/FREE/TV",
              "https://spirt007.github.io/Tvru/Rus.m3u",
              "https://iptv.axenov.dev/so",
              "https://loganet.vercel.app/LoganetXStrawberry.m3u",
          ]

          OUTPUT = "playlist.m3u"

          # ============================================================
          # УДАЛЕНИЕ ГРУПП
          # ============================================================

          DELETE_GROUPS = {
              "Catcast TV 🐈 Not 24/7",

              "Австралия",
              "Австрия",
              "Азия",
              "Албания",
              "Арабские",
              "Аргентина",
              "АСАРТА (🇷🇺VPN)",
              "Африка",
              "Болгария",
              "Бразилия",
              "Великобритания",
              "Венгрия",
              "Германия",
              "Греция",
              "Израиль",
              "ИНФО",
              "Информационные",
              "Иран",
              "Испания",
              "Италия",
              "Канада",
              "Латинская Америка",
              "Мексика",
              "Мода",
              "Музыкальные",
              "Музыкальные 🎶",
              "Нидерланды",
              "Оргтехсервис (VPN 🇷🇺)",
              "Остальная Европа",
              "ПОДАРОК премиальный плейлист",
              "Польша",
              "Португалия",
              "Радио",
              "Румыния",
              "Сербия",
              "Словакия",
              "США",
              "Тех поддержка",
              "Франция",
              "Хорватия",
              "🔺 INFO 🔺",

              "TEST (VPN)",
              "TEST ⓵",

              "Чехия",
              "НТВ",
              "Твоё ТВ",
          }

          # ============================================================
          # ОБЪЕДИНЕНИЯ
          # ============================================================

          GROUP_MAP = {

              # КИНО
              "IPTVPLAY (Кинозал)": "Кино и сериалы",
              "Кино Online": "Кино и сериалы",
              "Кино и сериалы (Российские)": "Кино и сериалы",
              "Кинозалы": "Кино и сериалы",
              "Кинозалы (VPN)": "Кино и сериалы",
              "Премьеры и хиты": "Кино и сериалы",
              "Сериалы НТВ": "Кино и сериалы",
              "Фильмы и сериалы": "Кино и сериалы",

              # СПОРТ
              "Спортивные": "Спорт",
              "Спорткомплекс 🏆": "Спорт",

              # НОВОСТИ
              "Новостные": "Новости",

              # ПОЗНАВАТЕЛЬНЫЕ
              "Образовательные": "Познавательные",

              # РАЗВЛЕКАТЕЛЬНЫЕ
              "Развлекательные (Местные)": "Развлекательные",

              # РЕГИОНАЛЬНЫЕ
              "Местные": "Региональные",

              # ОБЩЕСТВЕННЫЕ
              "Общие": "Общественные",

              # WINK
              "Wink (VPN 🇷🇺)": "Wink",
              "Wink и другие часовые пояса": "Wink",

              # ВЗРОСЛЫЕ
              "Эротика": "Взрослые",
          }

          # ============================================================
          # ОЧЕВИДНАЯ ЭРОТИКА
          # ============================================================

          ADULT_WORDS = [
              "porn",
              "porno",
              "xxx",
              "erotic",
              "erotica",
              "adult",
              "playboy",
              "penthouse",
              "brazzers",
              "hustler",
              "dorcel",
              "private",
              "passion xxx",
              "порно",
              "эрот",
              "порн",
          ]

          # ============================================================
          # СТРАНЫ, КОТОРЫЕ ДОЛЖНЫ БЫТЬ В САМОМ НИЗУ
          # ============================================================

          BOTTOM_GROUPS = [
              "Взрослые",
              "Индия",
              "Грузия",

              "Азербайджан",
              "Армения",
              "Беларусь",
              "Казахстан",
              "Кыргызстан",
              "Молдавия",
              "Молдова",
              "Таджикистан",
              "Туркменистан",
              "Узбекистан",
          ]

          BOTTOM_RANK = {
              group: index
              for index, group in enumerate(BOTTOM_GROUPS)
          }

          def get_group(info):
              match = re.search(
                  r'group-title="([^"]*)"',
                  info,
                  flags=re.IGNORECASE
              )

              if match:
                  return match.group(1).strip()

              return ""

          def set_group(info, group):
              if re.search(
                  r'group-title="[^"]*"',
                  info,
                  flags=re.IGNORECASE
              ):
                  return re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{group}"',
                      info,
                      flags=re.IGNORECASE
                  )

              return info

          def is_adult(info, group):
              text = (
                  info + " " + group
              ).lower()

              return any(
                  word in text
                  for word in ADULT_WORDS
              )

          # ============================================================
          # СКАЧИВАНИЕ
          # ============================================================

          def download_playlist(url):

              for attempt in range(3):

                  try:
                      response = requests.get(
                          url,
                          headers={
                              "User-Agent":
                                  "Mozilla/5.0 IPTV Builder"
                          },
                          timeout=(15, 60),
                          allow_redirects=True
                      )

                      if (
                          response.status_code == 200
                          and len(response.text) > 20
                      ):
                          print(f"SOURCE OK: {url}")
                          return response.text

                      print(
                          f"SOURCE STATUS "
                          f"{response.status_code}: {url}"
                      )

                  except Exception as error:
                      print(
                          f"SOURCE ERROR "
                          f"{attempt + 1}/3: "
                          f"{url} -> {error}"
                      )

                  time.sleep(2)

              return ""

          # ============================================================
          # РАЗБОР M3U
          # ============================================================

          def extract_entries(text):

              lines = (
                  text
                  .replace("\r\n", "\n")
                  .replace("\r", "\n")
                  .split("\n")
              )

              entries = []
              current_info = None

              for line in lines:

                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF:"):
                      current_info = line
                      continue

                  if line.startswith("#"):
                      continue

                  if (
                      current_info
                      and (
                          line.startswith("http://")
                          or line.startswith("https://")
                          or line.startswith("rtmp://")
                      )
                  ):
                      entries.append(
                          (current_info, line)
                      )

                      current_info = None

              return entries

          # ============================================================
          # ПРОВЕРКА ПОТОКА
          # ============================================================

          def check_stream(item):

              info, url = item

              headers = {
                  "User-Agent":
                      "VLC/3.0.20 LibVLC/3.0.20",
                  "Accept": "*/*",
                  "Connection": "keep-alive",
              }

              for attempt in range(3):

                  response = None

                  try:

                      response = requests.get(
                          url,
                          headers=headers,
                          stream=True,
                          timeout=(10, 20),
                          allow_redirects=True
                      )

                      status = response.status_code

                      if 200 <= status < 300:
                          response.close()
                          return True, item

                      if 300 <= status < 400:
                          response.close()
                          return True, item

                      if status in (
                          401,
                          403,
                          408,
                          425,
                          429,
                      ) or status >= 500:

                          response.close()

                          if attempt < 2:
                              time.sleep(1.5)
                              continue

                          return True, item

                      if status in (
                          400,
                          404,
                          410,
                      ):

                          response.close()

                          if attempt < 2:
                              time.sleep(1)
                              continue

                          return False, item

                      response.close()

                  except requests.exceptions.Timeout:

                      if attempt < 2:
                          time.sleep(1.5)
                          continue

                      return True, item

                  except requests.exceptions.ConnectionError:

                      if attempt < 2:
                          time.sleep(1.5)
                          continue

                      return True, item

                  except Exception:

                      if attempt < 2:
                          time.sleep(1.5)
                          continue

                      return True, item

                  finally:

                      if response is not None:
                          try:
                              response.close()
                          except Exception:
                              pass

              return True, item

          # ============================================================
          # СКАЧИВАЕМ ВСЕ 5 ИСТОЧНИКОВ
          # ============================================================

          print("")
          print("======================================")
          print("DOWNLOADING IPTV SOURCES")
          print("======================================")

          all_entries = []

          for source in SOURCES:

              text = download_playlist(source)

              if not text:
                  print(
                      f"SOURCE FAILED: {source}"
                  )
                  continue

              entries = extract_entries(text)

              print(
                  f"{source} -> "
                  f"{len(entries)} entries"
              )

              for info, url in entries:

                  original_group = get_group(info)

                  # Удаляем согласованные группы
                  if original_group in DELETE_GROUPS:
                      continue

                  # Применяем только согласованные объединения
                  new_group = GROUP_MAP.get(
                      original_group,
                      original_group
                  )

                  if not new_group:
                      new_group = "Без категории"

                  # Эротика -> Взрослые
                  if is_adult(
                      info,
                      original_group
                  ):
                      new_group = "Взрослые"

                  info = set_group(
                      info,
                      new_group
                  )

                  # ДУБЛИ НЕ УДАЛЯЕМ
                  all_entries.append(
                      (info, url)
                  )

          print("")
          print(
              f"TOTAL BEFORE CHECK: "
              f"{len(all_entries)}"
          )

          # ============================================================
          # ПРОВЕРКА ПОТОКОВ
          # ============================================================

          print("")
          print("======================================")
          print("FAST SMART STREAM CHECK")
          print("======================================")

          working = []

          with ThreadPoolExecutor(
              max_workers=50
          ) as executor:

              futures = [
                  executor.submit(
                      check_stream,
                      entry
                  )
                  for entry in all_entries
              ]

              total = len(futures)

              for number, future in enumerate(
                  as_completed(futures),
                  1
              ):

                  ok, entry = future.result()

                  if ok:
                      working.append(entry)

                  if number % 100 == 0:

                      print(
                          f"CHECKED: "
                          f"{number}/{total} | "
                          f"KEPT: "
                          f"{len(working)}"
                      )

          print("")
          print(
              f"WORKING STREAMS: "
              f"{len(working)}"
          )

          # ============================================================
          # ФИНАЛЬНАЯ СОРТИРОВКА ГРУПП
          #
          # Обычные группы остаются в исходном порядке.
          #
          # В самый низ:
          # Взрослые
          # Индия
          # Грузия
          # страны СНГ
          # ============================================================

          regular_entries = []
          bottom_entries = []

          for entry in working:

              group = get_group(entry[0])

              if group in BOTTOM_RANK:
                  bottom_entries.append(entry)
              else:
                  regular_entries.append(entry)

          bottom_entries.sort(
              key=lambda entry:
                  BOTTOM_RANK[get_group(entry[0])]
          )

          working = (
              regular_entries
              + bottom_entries
          )

          # ============================================================
          # СОХРАНЕНИЕ
          # ============================================================

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as file:

              file.write("#EXTM3U\n")

              for info, url in working:

                  file.write(
                      info + "\n"
                  )

                  file.write(
                      url + "\n"
                  )

          print("")
          print(
              f"PLAYLIST CREATED: "
              f"{OUTPUT}"
          )

          print("")
          print("======================================")
          print("FINAL GROUP ORDER")
          print("======================================")

          seen_groups = []

          for info, url in working:
              group = get_group(info)

              if group not in seen_groups:
                  seen_groups.append(group)

          for number, group in enumerate(
              seen_groups,
              1
          ):
              print(
                  f"{number}. {group}"
              )

          PY

      - name: Build playlist
        run: |
          python build_playlist.py

      - name: Commit updated playlist
        run: |
          git config user.name "IPTV Bot"
          git config user.email "actions@users.noreply.github.com"

          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Update IPTV playlist"
            git push
          fi
