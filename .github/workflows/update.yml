              # Основные бесплатные/публичные телевизионные подборки.
              "https://raw.githubusercontent.com/UFOTVM/TV/refs/heads/main/ufo.m3u",
              "https://raw.githubusercontent.com/Dimonovich/TV/Dimonovich/FREE/TV",
              "https://bit.ly/Endik1",
              "https://tinyurl.com/KinomixTV",
              "https://bit.ly/vivamax-m3u",
              "https://tinyurl.com/shamsiptv",
              "https://raw.githubusercontent.com/Tivinor/tivinor/refs/heads/main/tivinor.m3u",
              "https://raw.githubusercontent.com/MaxTVNew01/Maxtvvhs/refs/heads/main/LICENSE.m3u",
              "https://raw.githubusercontent.com/iptv-free/TV/refs/heads/FREE/TV",
              "https://raw.githubusercontent.com/Dolov07KBR/DF_IPTV/refs/heads/main/07.m3u",
              "https://spirt007.github.io/Tvru/Rus.m3u",
              "https://raw.githubusercontent.com/IPTVSHARED/VeronaTV/refs/heads/main/VeronaTV.m3u",
