              "https://tinyurl.com/xteen18",
              "https://tinyurl.com/sexture18",
              "https://tinyurl.com/adultip18",
          ]

          OUTPUT = "playlist.m3u"

          ADULT_SOURCES = {
              "https://tinyurl.com/xteen18",
              "https://tinyurl.com/sexture18",
              "https://tinyurl.com/adultip18",
          }


          # ============================================================
          # ГРУППЫ, КОТОРЫЕ УДАЛЯЕМ
          # ============================================================

          DELETE_GROUPS = {
              "Catcast TV 🐈 Not 24/7",
              "ПОДАРОК премиальный плейлист",
              "Тех поддержка",
              "TEST (VPN)",
