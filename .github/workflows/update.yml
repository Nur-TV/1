name: Update IPTV playlist

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3,15 * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Create IPTV processor
        run: |
          cat > build_playlist.py <<'PY'

          import re
          import time
          import subprocess
          import requests

          from concurrent.futures import ThreadPoolExecutor, as_completed


          # ============================================================
          # ИСТОЧНИКИ
          # ============================================================

          SOURCES = [
              "https://raw.githubusercontent.com/IPTVSHARED/VeronaTV/refs/heads/main/VeronaTV.m3u",
              "https://raw.githubusercontent.com/Dimonovich/TV/Dimonovich/FREE/TV",
              "https://spirt007.github.io/Tvru/Rus.m3u",
              "https://iptv.axenov.dev/so",
              "https://loganet.vercel.app/LoganetXStrawberry.m3u",
          ]

          OUTPUT = "playlist.m3u"


          # ============================================================
          # ГРУППЫ, КОТОРЫЕ УДАЛЯЕМ
          # ============================================================

          DELETE_GROUPS = {
              "4K VIDEO (VPN)",

              "Catcast TV 🐈 Not 24/7",

              "Австралия",
              "Австрия",
              "Азия",
              "Албания",
              "Арабские",
              "Аргентина",
              "АСАРТА (🇷🇺VPN)",
              "Африка",

              "Болгария",
              "Бразилия",
              "Великобритания",
              "Венгрия",
              "Германия",
              "Греция",

              "Израиль",

              "ИНФО",
              "Информационные",
              "Иран",
              "Испания",
              "Италия",

              "Канада",
              "Латинская Америка",
              "Мексика",
              "Мода",

              "Музыкальные",
              "Музыкальные 🎶",

              "Нидерланды",

              "Оргтехсервис (VPN 🇷🇺)",

              "Остальная Европа",

              "ПОДАРОК премиальный плейлист",

              "Польша",
              "Португалия",

              "Радио",

              "Румыния",
              "Сербия",
              "Словакия",
              "США",

              "Тех поддержка",

              "Франция",
              "Хорватия",

              "🔺 INFO 🔺",

              "TEST (VPN)",
              "TEST ⓵",

              "Чехия",
              "НТВ",
              "Твоё ТВ",
          }


          # ============================================================
          # ОБЪЕДИНЕНИЕ ГРУПП
          # ============================================================

          GROUP_MAP = {

              # КИНО
              "IPTVPLAY (Кинозал)": "Кино и сериалы",
              "Кино Online": "Кино и сериалы",
              "Кино и сериалы (Российские)": "Кино и сериалы",
              "Кинозалы": "Кино и сериалы",
              "Кинозалы (VPN)": "Кино и сериалы",
              "Премьеры и хиты": "Кино и сериалы",
              "Сериалы НТВ": "Кино и сериалы",
              "Фильмы и сериалы": "Кино и сериалы",

              # СПОРТ
              "Спортивные": "Спорт",
              "Спорткомплекс 🏆": "Спорт",

              # НОВОСТИ
              "Новостные": "Новости",

              # ПОЗНАВАТЕЛЬНЫЕ
              "Образовательные": "Познавательные",

              # РАЗВЛЕКАТЕЛЬНЫЕ
              "Развлекательные (Местные)": "Развлекательные",

              # РЕГИОНАЛЬНЫЕ
              "Местные": "Региональные",

              # ОБЩЕСТВЕННЫЕ
              "Общие": "Общественные",

              # WINK
              "Wink (VPN 🇷🇺)": "Разное",
              "Wink и другие часовые пояса": "Разное",

              # СНГ
              "Itv.uz (🇺🇿)": "Узбекистан",

              # TURON ОСТАВЛЯЕМ ОТДЕЛЬНО
              "Turon Media (VPN)": "Turon Media (VPN)",

              # ОТДЕЛЬНЫЕ СТРАНЫ СНГ
              "Азербайджан": "Азербайджан",
              "Армения": "Армения",
              "Беларусь": "Беларусь",
              "Казахстан": "Казахстан",
              "Кыргызстан": "Кыргызстан",
              "Молдавия": "Молдавия",
              "Таджикистан": "Таджикистан",
              "Туркменистан": "Туркменистан",
              "Узбекистан": "Узбекистан",

              # НЕ СНГ
              "Индия": "Индия",
              "Грузия": "Грузия",
              "Турция": "Турция",

              # ВЗРОСЛЫЕ
              "Эротика": "Взрослые",
          }


          # ============================================================
          # СТРАННЫЕ / ТЕХНИЧЕСКИЕ ГРУППЫ -> РАЗНОЕ
          # ============================================================

          MISC_GROUPS = {
              "StarNet (VPN 🇳🇱)",
              "Сириус",
              "Vivacom BG",
              "NNT",
              "Oracle Corporation",
              "Cloud_Flare",
              "Cloudflare_Inc!",
              "Инет",
              "Internet42 LLC",
              "📺 Usba TV",
              "RELAX🏝️",
              "С сайтов",
              "С сайтов (VPN)",
              "Современные сетевые технологии (VPN)",
              "Цитадель-Крым (VPN)",
              "Lime (VPN 🇷🇺)",
              "Большое ТВ (VPN)",
              "Rutube (VPN)",
              "Виктория (VPN 🇷🇺)",
              "Квант-Телеком (VPN 🇷🇺)",
              "Webhost (VPN 🇷🇺)",
              "Телевизор 24 (VPN)",
              "↕️ Торрент ТВ ↕️",
              "Подборка каналов с интернета",
              "Подборка",
          }


          # ============================================================
          # ПОРЯДОК ГРУПП
          # ============================================================

          GROUP_ORDER = [
              "Кино и сериалы",
              "Федеральные",
              "Развлекательные",
              "Спорт",
              "Детские",
              "Религиозные",
              "Эфирные",
              "Познавательные",
              "Региональные",
              "Новости",
              "Разное",
              "Мужские",
              "Без категории",
              "Общественные",
              "Будущее",
              "Досуг",
              "Культура",
              "Христианские",
              "Хобби и увлечения",
              "Медитативные",
              "Взрослые",
              "Индия",
              "Грузия",
              "Турция",
              "Азербайджан",
              "Армения",
              "Беларусь",
              "Казахстан",
              "Кыргызстан",
              "Молдавия",
              "Таджикистан",
              "Туркменистан",
              "Узбекистан",
              "Turon Media (VPN)",
          ]


          # ============================================================
          # ОЧЕВИДНЫЕ ВЗРОСЛЫЕ КАНАЛЫ
          # ============================================================

          ADULT_WORDS = [
              "porn",
              "porno",
              "xxx",
              "erotic",
              "erotica",
              "adult",
              "playboy",
              "penthouse",
              "brazzers",
              "hustler",
              "dorcel",
              "private",
              "passion xxx",
              "порно",
              "эрот",
              "порн",
          ]


          # ============================================================
          # ПОЛУЧЕНИЕ ГРУППЫ
          # ============================================================

          def get_group(info):

              match = re.search(
                  r'group-title="([^"]*)"',
                  info,
                  flags=re.IGNORECASE
              )

              if match:
                  return match.group(1).strip()

              return ""


          def set_group(info, group):

              if re.search(
                  r'group-title="[^"]*"',
                  info,
                  flags=re.IGNORECASE
              ):
                  return re.sub(
                      r'group-title="[^"]*"',
                      f'group-title="{group}"',
                      info,
                      flags=re.IGNORECASE
                  )

              return info


          def is_adult(info, group):

              text = (
                  info
                  + " "
                  + group
              ).lower()

              return any(
                  word in text
                  for word in ADULT_WORDS
              )


          # ============================================================
          # СКАЧИВАНИЕ
          # ============================================================

          def download_playlist(url):

              for attempt in range(3):

                  try:

                      response = requests.get(
                          url,
                          headers={
                              "User-Agent":
                                  "Mozilla/5.0 IPTV Builder"
                          },
                          timeout=(15, 60),
                          allow_redirects=True
                      )

                      if (
                          response.status_code == 200
                          and len(response.text) > 20
                      ):

                          print(
                              f"SOURCE OK: {url}"
                          )

                          return response.text

                      print(
                          f"SOURCE STATUS "
                          f"{response.status_code}: "
                          f"{url}"
                      )

                  except Exception as error:

                      print(
                          f"SOURCE ERROR "
                          f"{attempt + 1}/3: "
                          f"{url} -> {error}"
                      )

                  time.sleep(2)

              return ""


          # ============================================================
          # РАЗБОР M3U
          # ============================================================

          def extract_entries(text):

              lines = (
                  text
                  .replace("\r\n", "\n")
                  .replace("\r", "\n")
                  .split("\n")
              )

              entries = []

              current_info = None

              for line in lines:

                  line = line.strip()

                  if not line:
                      continue

                  if line.startswith("#EXTINF:"):

                      current_info = line

                      continue

                  if line.startswith("#"):

                      continue

                  if (
                      current_info
                      and (
                          line.startswith("http://")
                          or line.startswith("https://")
                          or line.startswith("rtmp://")
                      )
                  ):

                      entries.append(
                          (
                              current_info,
                              line
                          )
                      )

                      current_info = None

              return entries


          # ============================================================
          # ПРОВЕРКА РЕАЛЬНОГО МЕДИАПОТОКА
          #
          # ВАЖНО:
          #
          # HTTP 200 больше НЕ считается достаточным.
          #
          # Используем ffprobe.
          #
          # ffprobe должен увидеть настоящий медиапоток.
          # ============================================================

          def probe_stream(item):

              info, url = item

              headers = (
                  "User-Agent: VLC/3.0.20\r\n"
                  "Accept: */*\r\n"
              )

              command = [
                  "ffprobe",

                  "-v",
                  "error",

                  "-hide_banner",

                  "-user_agent",
                  "VLC/3.0.20",

                  "-rw_timeout",
                  "10000000",

                  "-timeout",
                  "10000000",

                  "-analyzeduration",
                  "8000000",

                  "-probesize",
                  "5000000",

                  "-show_entries",
                  "stream=codec_type",

                  "-of",
                  "csv=p=0",

                  url
              ]

              for attempt in range(3):

                  try:

                      result = subprocess.run(
                          command,
                          stdout=subprocess.PIPE,
                          stderr=subprocess.PIPE,
                          text=True,
                          timeout=15
                      )

                      output = (
                          result.stdout
                          or ""
                      ).lower()

                      error = (
                          result.stderr
                          or ""
                      ).lower()

                      # ------------------------------------------------
                      # Настоящий поток найден
                      # ------------------------------------------------

                      if (
                          result.returncode == 0
                          and (
                              "video" in output
                              or "audio" in output
                          )
                      ):

                          return True, item

                      # ------------------------------------------------
                      # Некоторые IPTV-потоки возвращают данные,
                      # но ffprobe завершается с предупреждением.
                      #
                      # Если в stderr явно видны признаки найденного
                      # транспорта/потока — разрешаем.
                      # ------------------------------------------------

                      stream_signs = [
                          "mpegts",
                          "hls",
                          "mpeg-2",
                          "aac",
                          "h264",
                          "hevc",
                          "avc",
                          "mpeg4",
                          "ac-3",
                      ]

                      if any(
                          sign in error
                          for sign in stream_signs
                      ) and (
                          "invalid data" not in error
                          or "mpegts" in error
                      ):

                          if attempt == 2:
                              return True, item

                      time.sleep(1.5)

                  except subprocess.TimeoutExpired:

                      if attempt < 2:
                          continue

                  except Exception:

                      if attempt < 2:
                          continue

              return False, item


          # ============================================================
          # ЗАГРУЖАЕМ ИСТОЧНИКИ
          # ============================================================

          print("")
          print("======================================")
          print("DOWNLOADING IPTV SOURCES")
          print("======================================")

          all_entries = []

          for source in SOURCES:

              text = download_playlist(source)

              if not text:

                  print(
                      f"SOURCE FAILED: {source}"
                  )

                  continue

              entries = extract_entries(text)

              print(
                  f"{source} -> "
                  f"{len(entries)} entries"
              )

              for info, url in entries:

                  original_group = get_group(info)

                  # ----------------------------------------------------
                  # Удаление
                  # ----------------------------------------------------

                  if original_group in DELETE_GROUPS:

                      continue

                  # ----------------------------------------------------
                  # Странные технические группы
                  # ----------------------------------------------------

                  if original_group in MISC_GROUPS:

                      new_group = "Разное"

                  else:

                      new_group = GROUP_MAP.get(
                          original_group,
                          original_group
                      )

                  # ----------------------------------------------------
                  # Пустая группа
                  # ----------------------------------------------------

                  if not new_group:

                      new_group = "Без категории"

                  # ----------------------------------------------------
                  # Взрослые
                  # ----------------------------------------------------

                  if is_adult(
                      info,
                      original_group
                  ):

                      new_group = "Взрослые"

                  # ----------------------------------------------------
                  # Устанавливаем группу
                  # ----------------------------------------------------

                  info = set_group(
                      info,
                      new_group
                  )

                  # ----------------------------------------------------
                  # ДУБЛИКАТЫ НЕ УДАЛЯЕМ
                  # ----------------------------------------------------

                  all_entries.append(
                      (
                          info,
                          url
                      )
                  )


          print("")
          print(
              f"TOTAL BEFORE CHECK: "
              f"{len(all_entries)}"
          )


          # ============================================================
          # ГЛУБОКАЯ ПРОВЕРКА
          # ============================================================

          print("")
          print("======================================")
          print("REAL MEDIA STREAM CHECK")
          print("======================================")

          working = []

          # 25 одновременных проверок.
          #
          # Это значительно безопаснее для источников,
          # чем 50+ одновременных соединений.
          #
          # При этом процесс всё равно будет параллельным.

          MAX_WORKERS = 25

          with ThreadPoolExecutor(
              max_workers=MAX_WORKERS
          ) as executor:

              futures = [
                  executor.submit(
                      probe_stream,
                      entry
                  )
                  for entry in all_entries
              ]

              total = len(futures)

              for number, future in enumerate(
                  as_completed(futures),
                  1
              ):

                  try:

                      ok, entry = future.result()

                      if ok:

                          working.append(entry)

                  except Exception:

                      pass

                  if number % 100 == 0:

                      print(
                          f"CHECKED: "
                          f"{number}/{total} | "
                          f"WORKING: "
                          f"{len(working)}"
                      )


          print("")
          print(
              f"WORKING STREAMS: "
              f"{len(working)}"
          )


          # ============================================================
          # СОБИРАЕМ ГРУППЫ
          # ============================================================

          grouped = {}

          for info, url in working:

              group = get_group(info)

              if not group:

                  group = "Без категории"

              grouped.setdefault(
                  group,
                  []
              ).append(
                  (
                      info,
                      url
                  )
              )


          # ============================================================
          # ФОРМИРУЕМ ФИНАЛЬНЫЙ ПОРЯДОК
          # ============================================================

          ordered_groups = []

          # Сначала группы из GROUP_ORDER

          for group in GROUP_ORDER:

              if group in grouped:

                  ordered_groups.append(
                      group
                  )


          # Затем любые новые неизвестные группы,
          # чтобы ничего случайно не потерять.

          for group in grouped:

              if group not in ordered_groups:

                  ordered_groups.append(
                      group
                  )


          print("")
          print("======================================")
          print("FINAL GROUP ORDER")
          print("======================================")


          for number, group in enumerate(
              ordered_groups,
              1
          ):

              print(
                  f"{number}. {group}"
              )


          # ============================================================
          # СОХРАНЕНИЕ
          # ============================================================

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as file:

              file.write(
                  "#EXTM3U\n"
              )

              for group in ordered_groups:

                  for info, url in grouped[group]:

                      file.write(
                          info + "\n"
                      )

                      file.write(
                          url + "\n"
                      )


          print("")
          print(
              f"PLAYLIST CREATED: "
              f"{OUTPUT}"
          )

          PY

      - name: Build playlist
        run: |
          python build_playlist.py

      - name: Commit updated playlist
        run: |
          git config user.name "IPTV Bot"
          git config user.email "actions@users.noreply.github.com"

          git add playlist.m3u

          if git diff --cached --quiet; then
            echo "No playlist changes."
          else
            git commit -m "Deep check IPTV streams and update playlist"
            git push
          fi
