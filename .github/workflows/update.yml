name: Update IPTV playlist

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3,15 * * *"

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Нужна полная история, чтобы git pull --rebase мог корректно
          # объединить изменения от параллельного обновления EPG.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Create IPTV processor
        run: |
          cat > build_playlist.py <<'PY'

          import re
          import time
          import subprocess
          import requests

          from concurrent.futures import ThreadPoolExecutor, as_completed


          # ============================================================
          # ИСТОЧНИКИ
          # ============================================================

