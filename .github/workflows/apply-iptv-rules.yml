name: Apply IPTV group rules

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-rules:
    if: github.event.head_commit.message != 'Apply final IPTV group rules'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply final IPTV rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/update.yml')
          text = path.read_text(encoding='utf-8')

          # Add the three explicitly requested deletions.
          delete_anchor = '              "TEST ⓵",\n          }'
          delete_replacement = '              "TEST ⓵",\n\n              "Чехия",\n              "НТВ",\n              "Твоё ТВ",\n          }'
          if '"Чехия"' not in text or '"НТВ"' not in text or '"Твоё ТВ"' not in text:
              if delete_anchor not in text:
                  raise SystemExit('DELETE_GROUPS anchor not found')
              text = text.replace(delete_anchor, delete_replacement, 1)

          # Restore the CIS groups instead of merging them into СНГ.
          cng_start = '              # СНГ\n'
          adult_start = '              # ВЗРОСЛЫЕ\n'
          start = text.find(cng_start)
          end = text.find(adult_start, start)
          if start == -1 or end == -1:
              raise SystemExit('CIS GROUP_MAP block not found')

          replacement = '''              # ВЗРОСЛЫЕ\n              "Эротика": "Взрослые",\n'''
          text = text[:start] + replacement + text[end + len(adult_start):]

          # Put 18+, then India, Georgia, then every CIS country at the bottom.
          sort_marker = '          # ============================================================\n          # СОХРАНЕНИЕ\n          # ============================================================\n'
          sort_code = '''          # ============================================================\n          # ФИНАЛЬНЫЙ ПОРЯДОК ГРУПП\n          # 18+ -> Индия -> Грузия -> все страны СНГ\n          # ============================================================\n\n          BOTTOM_GROUPS = [\n              "Взрослые",\n              "Индия",\n              "Грузия",\n              "Азербайджан",\n              "Армения",\n              "Беларусь",\n              "Казахстан",\n              "Кыргызстан",\n              "Молдавия",\n              "Молдова",\n              "Таджикистан",\n              "Туркменистан",\n              "Узбекистан",\n          ]\n\n          bottom_rank = {group: index for index, group in enumerate(BOTTOM_GROUPS)}\n          bottom_entries = []\n          regular_entries = []\n\n          for entry in working:\n              group = get_group(entry[0])\n              if group in bottom_rank:\n                  bottom_entries.append(entry)\n              else:\n                  regular_entries.append(entry)\n\n          # Keep the existing order of all other groups/channels.\n          # Only the requested bottom groups are moved.\n          bottom_entries.sort(key=lambda entry: bottom_rank[get_group(entry[0])])\n          working = regular_entries + bottom_entries\n\n'''
          if sort_marker not in text:
              raise SystemExit('SAVE marker not found')
          if 'BOTTOM_GROUPS = [' not in text:
              text = text.replace(sort_marker, sort_code + sort_marker, 1)

          path.write_text(text, encoding='utf-8')
          print('IPTV rules applied successfully')
          PY

      - name: Commit changes
        run: |
          git config user.name "IPTV Bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/update.yml .github/workflows/apply-iptv-rules.yml
          git commit -m "Apply final IPTV group rules"
          git push

      - name: Remove helper workflow
        if: always()
        run: |
          git config user.name "IPTV Bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f .github/workflows/apply-iptv-rules.yml ]; then
            git rm .github/workflows/apply-iptv-rules.yml
            git commit -m "Remove temporary IPTV rules workflow"
            git push
          fi
