name: Build IPTV candidate preview (no publish)

on:
  push:
    paths:
      - 'tools/build_playlist_preview.py'
      - 'tools/probe_playlist_preview.py'
      - 'tools/create_probe_review.py'
      - '.github/workflows/preview-playlist.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Build candidate preview only
        run: python tools/build_playlist_preview.py
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Probe each unique stream once
        run: python tools/probe_playlist_preview.py
      - name: Build conservative review copy (no publish)
        run: python tools/create_probe_review.py
      - name: Upload preview, probe results and report
        uses: actions/upload-artifact@v4
        with:
          name: nur-tv-playlist-candidate-preview
          path: |
            playlist-preview.m3u
            preview-report.md
            probe-report.md
            probe-results.csv
            playlist-review.m3u
            probe-cleanup-report.md
          if-no-files-found: error
          retention-days: 7
