name: Build IPTV candidate preview (no publish)

on:
  push:
    paths:
      - 'tools/build_playlist_preview.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Build candidate preview only
        run: python tools/build_playlist_preview.py
      - name: Upload preview and report
        uses: actions/upload-artifact@v4
        with:
          name: nur-tv-playlist-candidate-preview
          path: |
            playlist-preview.m3u
            preview-report.md
          if-no-files-found: error
          retention-days: 7
