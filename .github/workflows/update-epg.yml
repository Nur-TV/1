name: Update lightweight EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3,15 * * *"

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install rapidfuzz

      - name: Build combined lightweight EPG
        run: |
          cat > build_epg.py <<'PY'
          import gzip
          import re
          import unicodedata
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone
          from rapidfuzz import fuzz

          PLAYLIST_URL = "https://raw.githubusercontent.com/Nur-TV/1/main/playlist.m3u"

          EPG_SOURCES = [
              ("IPTVX_LITE", "https://iptvx.one/EPG.LITE"),
              ("IPTVX_FULL", "https://iptvx.one/EPG"),
              ("IPTVX_GZ", "https://iptvx.one/epg/epg.xml.gz"),
              ("EDEM", "http://epg.it999.ru/edem.xml.gz"),
          ]

          OUTPUT = "epg.xml.gz"

          # ============================================================
          # НАСТРОЙКИ
          # ============================================================

          DAYS_BACK = 3
          DAYS_FORWARD = 1

          # Минимальный процент похожести названий.
          # Более высокие значения защищают от ошибочных совпадений.
          FUZZY_LIMIT = 78

          # ============================================================
          # НОРМАЛИЗАЦИЯ НАЗВАНИЙ
          # ============================================================

          REMOVE_WORDS = {
              "hd",
              "fhd",
              "uhd",
              "4k",
              "8k",
              "sd",
              "hdtv",
              "tv",
              "телеканал",
              "канал",
              "channel",
              "online",
              "онлайн",
              "live",
              "лайв",
          }

          def norm(text):
              text = unicodedata.normalize(
                  "NFKC",
                  text or ""
              )

              text = text.lower()
              text = text.replace("ё", "е")

              # Удаляем технические пометки в скобках.
              text = re.sub(
                  r"\([^)]*\)",
                  " ",
                  text
              )

              text = re.sub(
                  r"\[[^]]*\]",
                  " ",
                  text
              )

              text = re.sub(
                  r"\{[^}]*\}",
                  " ",
                  text
              )

              # Убираем URL.
              text = re.sub(
                  r"https?://\S+",
                  " ",
                  text
              )

              # Разделяем знаки.
              text = re.sub(
                  r"[^0-9a-zа-яё]+",
                  " ",
                  text,
                  flags=re.IGNORECASE
              )

              words = []

              for word in text.split():

                  if word in REMOVE_WORDS:
                      continue

                  words.append(word)

              return " ".join(words).strip()


          def compact_norm(text):
              return re.sub(
                  r"[^0-9a-zа-яё]",
                  "",
                  norm(text),
                  flags=re.IGNORECASE
              )


          def get_attr(element, name):
              return (
                  element.get(name, "").strip()
                  if element is not None
                  else ""
              )


          # ============================================================
          # ЗАГРУЗКА
          # ============================================================

          def fetch(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                          "Mozilla/5.0 NurTV EPG Builder"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=180
              ) as response:

                  return response.read()


          def load_xml(url):

              raw = fetch(url)

              if raw[:2] == b"\x1f\x8b":
                  raw = gzip.decompress(raw)

              return ET.fromstring(raw)


          # ============================================================
          # ЧТЕНИЕ PLAYLIST
          # ============================================================

          print("")
          print("======================================")
          print("NURTV LIGHTWEIGHT EPG")
          print("======================================")

          print("Downloading playlist...")

          playlist_text = fetch(
              PLAYLIST_URL
          ).decode(
              "utf-8",
              errors="replace"
          )

          playlist_entries = []

          current_info = None

          for line in playlist_text.splitlines():

              line = line.strip()

              if not line:
                  continue

              if line.startswith("#EXTINF:"):

                  current_info = line
                  continue

              if (
                  current_info
                  and (
                      line.startswith("http://")
                      or line.startswith("https://")
                      or line.startswith("rtmp://")
                  )
              ):

                  name_match = re.search(
                      r",(.+)$",
                      current_info
                  )

                  if name_match:

                      name = name_match.group(1).strip()

                      id_match = re.search(
                          r'tvg-id="([^"]*)"',
                          current_info,
                          re.IGNORECASE
                      )

                      logo_match = re.search(
                          r'tvg-logo="([^"]*)"',
                          current_info,
                          re.IGNORECASE
                      )

                      tvg_id = (
                          id_match.group(1).strip()
                          if id_match
                          else ""
                      )

                      logo = (
                          logo_match.group(1).strip()
                          if logo_match
                          else ""
                      )

                      playlist_entries.append({
                          "name": name,
                          "norm": norm(name),
                          "compact": compact_norm(name),
                          "tvg_id": tvg_id,
                          "logo": logo,
                      })

                  current_info = None


          print(
              f"Playlist entries: "
              f"{len(playlist_entries)}"
          )


          # ============================================================
          # УНИКАЛЬНЫЕ КАНАЛЫ
          #
          # Сам M3U НЕ ИЗМЕНЯЕМ.
          # Уникализация нужна только для EPG.
          # ============================================================

          unique_channels = {}

          for channel in playlist_entries:

              if channel["tvg_id"]:

                  key = (
                      "id:",
                      channel["tvg_id"].lower()
                  )

              else:

                  key = (
                      "name:",
                      channel["norm"]
                  )

              if key not in unique_channels:

                  unique_channels[key] = channel

              else:

                  # Если у дубля есть логотип,
                  # а у первого нет — сохраняем логотип.
                  if (
                      not unique_channels[key]["logo"]
                      and channel["logo"]
                  ):

                      unique_channels[key]["logo"] = (
                          channel["logo"]
                      )


          playlist_channels = list(
              unique_channels.values()
          )

          print(
              f"Unique playlist channels: "
              f"{len(playlist_channels)}"
          )


          # ============================================================
          # ЗАГРУЖАЕМ EPG
          # ============================================================

          loaded_sources = []

          for source_name, source_url in EPG_SOURCES:

              print("")
              print(
                  f"Downloading EPG: "
                  f"{source_name}"
              )

              try:

                  root = load_xml(
                      source_url
                  )

                  channels = root.findall(
                      "channel"
                  )

                  programs = root.findall(
                      "programme"
                  )

                  print(
                      f"{source_name}: "
                      f"{len(channels)} channels, "
                      f"{len(programs)} programs"
                  )

                  loaded_sources.append({
                      "name": source_name,
                      "root": root,
                      "channels": channels,
                      "programs": programs,
                  })

              except Exception as error:

                  print(
                      f"{source_name} FAILED: "
                      f"{error}"
                  )


          # ============================================================
          # СОЗДАЁМ ИНДЕКСЫ EPG
          # ============================================================

          all_epg_channels = []

          for source_index, source in enumerate(
              loaded_sources
          ):

              for channel in source["channels"]:

                  cid = get_attr(
                      channel,
                      "id"
                  )

                  if not cid:
                      continue

                  display_names = []

                  for display in channel.findall(
                      "display-name"
                  ):

                      if (
                          display.text
                          and display.text.strip()
                      ):

                          display_names.append(
                              display.text.strip()
                          )

                  if not display_names:
                      display_names.append(cid)

                  normalized_names = set()

                  compact_names = set()

                  for name in display_names:

                      n = norm(name)

                      c = compact_norm(name)

                      if n:
                          normalized_names.add(n)

                      if c:
                          compact_names.add(c)

                  icon = channel.find(
                      "icon"
                  )

                  icon_url = ""

                  if icon is not None:

                      icon_url = get_attr(
                          icon,
                          "src"
                      )

                  all_epg_channels.append({
                      "source_index":
                          source_index,
                      "source_name":
                          source["name"],
                      "id":
                          cid,
                      "id_norm":
                          norm(cid),
                      "id_compact":
                          compact_norm(cid),
                      "names":
                          normalized_names,
                      "compact_names":
                          compact_names,
                      "icon":
                          icon_url,
                  })


          print("")
          print(
              f"Total EPG channel records: "
              f"{len(all_epg_channels)}"
          )


          # Быстрые индексы.

          by_id = {}
          by_name = {}
          by_compact = {}

          for item in all_epg_channels:

              by_id.setdefault(
                  item["id"].lower(),
                  []
              ).append(item)

              for name in item["names"]:

                  by_name.setdefault(
                      name,
                      []
                  ).append(item)

              for name in item["compact_names"]:

                  by_compact.setdefault(
                      name,
                      []
                  ).append(item)


          # ============================================================
          # ПОИСК ВСЕХ СОВПАДЕНИЙ
          # ============================================================

          def find_matches(channel):

              matches = []
              seen = set()

              # --------------------------------------------------------
              # 1. TVG-ID
              # --------------------------------------------------------

              if channel["tvg_id"]:

                  key = channel[
                      "tvg_id"
                  ].lower()

                  for item in by_id.get(
                      key,
                      []
                  ):

                      unique_key = (
                          item["source_index"],
                          item["id"]
                      )

                      if unique_key not in seen:

                          seen.add(
                              unique_key
                          )

                          matches.append(
                              (
                                  1000,
                                  item
                              )
                          )


              # --------------------------------------------------------
              # 2. ТОЧНОЕ НАЗВАНИЕ
              # --------------------------------------------------------

              for item in by_name.get(
                  channel["norm"],
                  []
              ):

                  unique_key = (
                      item["source_index"],
                      item["id"]
                  )

                  if unique_key not in seen:

                      seen.add(
                          unique_key
                      )

                      matches.append(
                          (
                              900,
                              item
                          )
                      )


              # --------------------------------------------------------
              # 3. КОМПАКТНОЕ НАЗВАНИЕ
              # --------------------------------------------------------

              for item in by_compact.get(
                  channel["compact"],
                  []
              ):

                  unique_key = (
                      item["source_index"],
                      item["id"]
                  )

                  if unique_key not in seen:

                      seen.add(
                          unique_key
                      )

                      matches.append(
                          (
                              850,
                              item
                          )
                      )


              # --------------------------------------------------------
              # 4. FUZZY
              #
              # Проверяем только кандидатов,
              # имеющих похожие первые символы/слова.
              # --------------------------------------------------------

              if not matches:

                  target = channel["norm"]

                  if len(target) >= 4:

                      target_words = set(
                          target.split()
                      )

                      for item in all_epg_channels:

                          best_score = 0

                          for candidate_name in item["names"]:

                              score1 = fuzz.ratio(
                                  target,
                                  candidate_name
                              )

                              score2 = fuzz.token_set_ratio(
                                  target,
                                  candidate_name
                              )

                              score = max(
                                  score1,
                                  score2
                              )

                              if score > best_score:

                                  best_score = score

                          if (
                              best_score
                              >= FUZZY_LIMIT
                          ):

                              unique_key = (
                                  item["source_index"],
                                  item["id"]
                              )

                              if unique_key not in seen:

                                  seen.add(
                                      unique_key
                                  )

                                  matches.append(
                                      (
                                          int(
                                              best_score
                                          ),
                                          item
                                      )
                                  )


              matches.sort(
                  key=lambda x: (
                      -x[0],
                      x[1]["source_index"]
                  )
              )

              return matches


          # ============================================================
          # СОПОСТАВЛЯЕМ КАНАЛЫ
          # ============================================================

          channel_matches = {}

          matched_count = 0
          unmatched_count = 0

          for channel in playlist_channels:

              matches = find_matches(
                  channel
              )

              channel_matches[
                  channel["norm"]
              ] = matches

              if matches:

                  matched_count += 1

              else:

                  unmatched_count += 1


          print("")
          print("======================================")
          print("MATCH RESULT")
          print("======================================")

          print(
              f"Playlist unique channels: "
              f"{len(playlist_channels)}"
          )

          print(
              f"EPG matched: "
              f"{matched_count}"
          )

          print(
              f"Without EPG: "
              f"{unmatched_count}"
          )


          # ============================================================
          # СОЗДАЁМ ИТОГОВЫЙ XMLTV
          # ============================================================

          output_root = ET.Element(
              "tv",
              {
                  "generator-info-name":
                      "NurTV combined lightweight EPG"
              }
          )


          output_channels = {}


          for number, channel in enumerate(
              playlist_channels,
              1
          ):

              output_id = (
                  channel["tvg_id"]
                  or f"nurtv-{number}"
              )

              output_id = re.sub(
                  r"[^A-Za-z0-9_.:-]",
                  "_",
                  output_id
              )

              out_channel = ET.SubElement(
                  output_root,
                  "channel",
                  {
                      "id": output_id
                  }
              )

              ET.SubElement(
                  out_channel,
                  "display-name"
              ).text = channel[
                  "name"
              ]

              # --------------------------------------------------------
              # ЛОГОТИП
              # --------------------------------------------------------

              logo = channel["logo"]

              if not logo:

                  matches = channel_matches[
                      channel["norm"]
                  ]

                  for score, item in matches:

                      if item["icon"]:

                          logo = item["icon"]
                          break

              if logo:

                  ET.SubElement(
                      out_channel,
                      "icon",
                      {
                          "src": logo
                      }
                  )

              output_channels[
                  channel["norm"]
              ] = {
                  "id": output_id,
                  "matches": channel_matches[
                      channel["norm"]
                  ],
              }


          # ============================================================
          # ОКНО EPG
          # ============================================================

          now = datetime.now(
              timezone.utc
          )

          window_start = (
              now
              - timedelta(
                  days=DAYS_BACK
              )
          )

          window_end = (
              now
              + timedelta(
                  days=DAYS_FORWARD
              )
          )


          # ============================================================
          # ПРОГРАММЫ
          #
          # ЧИТАЕМ ВСЕ ПРОГРАММЫ ТОЛЬКО ДЛЯ НАЙДЕННЫХ EPG ID.
          # ============================================================

          all_programmes = {}

          for source_index, source in enumerate(
              loaded_sources
          ):

              print(
                  f"Processing programs: "
                  f"{source['name']}"
              )

              for programme in source[
                  "programs"
              ]:

                  cid = get_attr(
                      programme,
                      "channel"
                  )

                  if not cid:
                      continue

                  start_text = get_attr(
                      programme,
                      "start"
                  )

                  stop_text = get_attr(
                      programme,
                      "stop"
                  )

                  if len(start_text) < 14:
                      continue

                  try:

                      start_dt = datetime.strptime(
                          start_text[:14],
                          "%Y%m%d%H%M%S"
                      ).replace(
                          tzinfo=timezone.utc
                      )

                  except Exception:

                      continue

                  if stop_text:

                      try:

                          stop_dt = datetime.strptime(
                              stop_text[:14],
                              "%Y%m%d%H%M%S"
                          ).replace(
                              tzinfo=timezone.utc
                          )

                      except Exception:

                          stop_dt = (
                              start_dt
                              + timedelta(
                                  hours=1
                              )
                          )

                  else:

                      stop_dt = (
                          start_dt
                          + timedelta(
                              hours=1
                          )
                      )


                  if (
                      stop_dt < window_start
                      or start_dt > window_end
                  ):

                      continue


                  title_element = programme.find(
                      "title"
                  )

                  if (
                      title_element is None
                      or not title_element.text
                  ):

                      continue

                  title = (
                      title_element.text
                      .strip()
                  )

                  if not title:
                      continue


                  key = (
                      source_index,
                      cid
                  )

                  all_programmes.setdefault(
                      key,
                      []
                  ).append(
                      (
                          start_text,
                          stop_text,
                          title
                      )
                  )


          # ============================================================
          # СВЯЗЫВАЕМ ПРОГРАММЫ С НАШИМИ КАНАЛАМИ
          # ============================================================

          total_programmes = 0


          for channel in playlist_channels:

              output = output_channels[
                  channel["norm"]
              ]

              output_id = output["id"]

              matches = output["matches"]

              programmes = {}

              for score, item in matches:

                  key = (
                      item["source_index"],
                      item["id"]
                  )

                  for (
                      start_text,
                      stop_text,
                      title
                  ) in all_programmes.get(
                      key,
                      []
                  ):

                      # Убираем дубли,
                      # которые могут присутствовать
                      # одновременно в нескольких источниках.

                      dedupe_key = (
                          start_text,
                          stop_text,
                          title.lower()
                      )

                      programmes[
                          dedupe_key
                      ] = (
                          start_text,
                          stop_text,
                          title
                      )


              ordered = sorted(
                  programmes.values(),
                  key=lambda x: x[0]
              )


              for (
                  start_text,
                  stop_text,
                  title
              ) in ordered:

                  programme_element = ET.SubElement(
                      output_root,
                      "programme",
                      {
                          "start": start_text,
                          "stop": stop_text,
                          "channel": output_id
                      }
                  )

                  ET.SubElement(
                      programme_element,
                      "title"
                  ).text = title

                  total_programmes += 1


          # ============================================================
          # СОХРАНЕНИЕ
          # ============================================================

          print("")
          print(
              f"EPG programs kept: "
              f"{total_programmes}"
          )


          ET.indent(
              output_root,
              space="  "
          )


          xml_data = ET.tostring(
              output_root,
              encoding="utf-8",
              xml_declaration=True
          )


          with gzip.open(
              OUTPUT,
              "wb",
              compresslevel=9
          ) as output_file:

              output_file.write(
                  xml_data
              )


          import os

          file_size = os.path.getsize(
              OUTPUT
          )


          print(
              f"Output compressed size: "
              f"{file_size} bytes"
          )

          print("")
          print("======================================")
          print("FINAL EPG READY")
          print("======================================")

          PY

          python build_epg.py

      - name: Commit EPG
        run: |
          git config user.name "IPTV Bot"
          git config user.email "actions@users.noreply.github.com"

          git add epg.xml.gz

          if git diff --cached --quiet; then
            echo "No EPG changes."
          else
            git commit -m "Update combined lightweight EPG"
            git push
          fi
