name: Update lightweight EPG

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3,15 * * *"

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build lightweight EPG
        run: |
          cat > build_epg.py <<'PY'
          import gzip
          import re
          import unicodedata
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timedelta, timezone

          PLAYLIST_URL = "https://raw.githubusercontent.com/Nur-TV/1/main/playlist.m3u"
          EPG_URL = "https://epg.one.team/3.1.xml.gz"
          OUTPUT = "epg.xml.gz"

          def norm(text):
              text = unicodedata.normalize("NFKC", text or "")
              text = text.lower().replace("ё", "е")
              text = re.sub(r"\([^)]*\)", " ", text)
              text = re.sub(r"\[[^]]*\]", " ", text)
              text = re.sub(r"\b(uhd|4k|fhd|hd|sd|hdtv)\b", " ", text)
              text = re.sub(r"[^\w\sа-яё]", " ", text, flags=re.IGNORECASE)
              return re.sub(r"\s+", " ", text).strip()

          def fetch(url):
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 NurTV EPG"})
              with urllib.request.urlopen(req, timeout=120) as r:
                  return r.read()

          print("Downloading playlist...")
          playlist = fetch(PLAYLIST_URL).decode("utf-8", errors="replace")

          playlist_names = set()
          playlist_logo_by_name = {}
          for line in playlist.splitlines():
              if not line.startswith("#EXTINF:"):
                  continue
              m = re.search(r",(.*)$", line)
              if not m:
                  continue
              name = m.group(1).strip()
              n = norm(name)
              if n:
                  playlist_names.add(n)
                  logo = re.search(r'tvg-logo="([^"]+)"', line, re.I)
                  if logo:
                      playlist_logo_by_name[n] = logo.group(1)

          print(f"Playlist channel names: {len(playlist_names)}")
          print("Downloading source EPG...")
          raw = fetch(EPG_URL)
          if raw[:2] == b"\\x1f\\x8b":
              raw = gzip.decompress(raw)

          root = ET.fromstring(raw)

          # Keep a compact 3-days-back + 1-day-forward window.
          now = datetime.now(timezone.utc)
          start = now - timedelta(days=3)
          end = now + timedelta(days=1)

          matched_ids = set()
          out_channels = []
          channel_names = {}

          for ch in root.findall("channel"):
              cid = ch.get("id", "")
              names = [x.text.strip() for x in ch.findall("display-name") if x.text and x.text.strip()]
              normalized = {norm(x) for x in names if norm(x)}
              if normalized & playlist_names:
                  matched_ids.add(cid)
                  out_channels.append(ch)
                  channel_names[cid] = names[0] if names else cid

          print(f"Matched EPG channels: {len(out_channels)}")

          out_root = ET.Element("tv", {"generator-info-name": "NurTV lightweight EPG"})

          # Channels: keep only id, names and logos. No extra metadata.
          for ch in out_channels:
              out_ch = ET.SubElement(out_root, "channel", {"id": ch.get("id", "")})
              names = [x.text.strip() for x in ch.findall("display-name") if x.text and x.text.strip()]
              for name in names[:3]:
                  ET.SubElement(out_ch, "display-name").text = name
              icon = ch.find("icon")
              icon_url = icon.get("src", "") if icon is not None else ""
              if not icon_url:
                  for n in names:
                      logo = playlist_logo_by_name.get(norm(n))
                      if logo:
                          icon_url = logo
                          break
              if icon_url:
                  ET.SubElement(out_ch, "icon", {"src": icon_url})

          kept_programs = 0
          for p in root.findall("programme"):
              cid = p.get("channel", "")
              if cid not in matched_ids:
                  continue
              try:
                  s = p.get("start", "")
                  e = p.get("stop", "")
                  ps = datetime.strptime(s[:14], "%Y%m%d%H%M%S").replace(tzinfo=timezone.utc)
                  pe = datetime.strptime(e[:14], "%Y%m%d%H%M%S").replace(tzinfo=timezone.utc) if e else ps + timedelta(hours=1)
              except Exception:
                  continue
              if pe < start or ps > end:
                  continue

              out_p = ET.SubElement(out_root, "programme", {
                  "start": p.get("start", ""),
                  "stop": p.get("stop", ""),
                  "channel": cid,
              })

              title = p.find("title")
              if title is not None and title.text:
                  t = ET.SubElement(out_p, "title", {"lang": title.get("lang", "ru")})
                  t.text = title.text.strip()

              # Deliberately omit desc, credits, category, episode-num,
              # rating, previously-shown, video/audio and all other metadata.
              kept_programs += 1

          tree = ET.ElementTree(out_root)
          ET.indent(tree, space="  ")
          xml_bytes = ET.tostring(out_root, encoding="utf-8", xml_declaration=True)
          with gzip.open(OUTPUT, "wb", compresslevel=9) as f:
              f.write(xml_bytes)

          print(f"EPG programs kept: {kept_programs}")
          print(f"Output compressed size: {len(gzip.compress(xml_bytes, compresslevel=9))} bytes")
          PY

          python build_epg.py

      - name: Commit EPG
        run: |
          git config user.name "IPTV Bot"
          git config user.email "actions@users.noreply.github.com"
          git add epg.xml.gz
          if git diff --cached --quiet; then
            echo "No EPG changes."
          else
            git commit -m "Update lightweight EPG"
            git push
          fi
