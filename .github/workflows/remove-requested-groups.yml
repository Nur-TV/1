name: Remove requested groups from test playlist

on:
  push:
    branches:
      - candidate-26-review-2026-11-23
    paths:
      - .github/workflows/remove-requested-groups.yml

permissions:
  contents: write

jobs:
  remove-groups:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-26-review-2026-11-23
      - name: Finalize test playlist categories
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re

          path = Path("playlist-test.m3u")
          lines = path.read_text(encoding="utf-8-sig").splitlines(keepends=True)
          food = re.compile(
              r"(?i)(?<![а-яё])еда(?![а-яё])|телекафе|food|"
              r"кулинари|кухн|готовк|рецепт|гастроном|гастро|"
              r"cooking|cookery|chef|masterchef|gourmet|"
              r"kitchen|(?<![а-яё])вкус(?![а-яё])|"
              r"повар|выпечк|кондитер|bbq|barbecue|grill|baking"
          )
          not_food = re.compile(
              r"(?i)побед|пираты карибского моря|смертельн.*дружин|"
              r"рецепт любви|вкуснятин|солнце на вкус|"
              r"\(\s*(?:19|20)\d{2}\s*\)|"
              r"^(?:CafeTV24|Cafe Trade TV|Polsat Cafe)$"
          )
          remove_groups = {"индия", "кыргызстан", "киргизстан"}
          blocks, current, preamble = [], [], []
          for line in lines:
              if line.startswith("#EXTINF:"):
                  if current:
                      blocks.append(current)
                  elif preamble:
                      blocks.append(preamble)
                      preamble = []
                  current = [line]
              elif current:
                  current.append(line)
              else:
                  preamble.append(line)
          if current:
              blocks.append(current)
          elif preamble:
              blocks.append(preamble)

          matched, corrected, removed_country = [], [], []
          ungrouped_misc = 0
          output_blocks = []
          for block in blocks:
              ext_index = next((i for i, line in enumerate(block) if line.startswith("#EXTINF:")), None)
              if ext_index is None:
                  output_blocks.append(block)
                  continue
              ext = block[ext_index]
              title = ext.split(",", 1)[1].strip() if "," in ext else ""
              group_match = re.search(r'\s+group-title="([^"]*)"', ext, re.I)
              current_group = group_match.group(1).strip() if group_match else ""
              normalized_group = current_group.casefold()
              if normalized_group in remove_groups:
                  removed_country.append((current_group, title))
                  continue
              if normalized_group == "разное":
                  ext = re.sub(r'\s+group-title="[^"]*"', '', ext, count=1, flags=re.I)
                  block[ext_index] = ext
                  current_group = ""
                  ungrouped_misc += 1
              if not_food.search(title):
                  if current_group == "Кулинария":
                      ext = re.sub(r'\s+group-title="[^"]*"', ' group-title="Разное"', ext, count=1, flags=re.I)
                      block[ext_index] = ext
                      corrected.append(title)
              elif food.search(title):
                  if re.search(r'\s+group-title="[^"]*"', ext, re.I):
                      ext = re.sub(r'\s+group-title="[^"]*"', ' group-title="Кулинария"', ext, count=1, flags=re.I)
                  else:
                      ext = ext.replace("#EXTINF:", '#EXTINF: group-title="Кулинария"', 1)
                  block[ext_index] = ext
                  matched.append(title)
              output_blocks.append(block)

          path.write_text("".join(line for block in output_blocks for line in block), encoding="utf-8", newline="")
          groups, total, no_group = Counter(), 0, 0
          for block in output_blocks:
              ext = next((line for line in block if line.startswith("#EXTINF:")), None)
              if ext:
                  total += 1
                  m = re.search(r'group-title="([^"]*)"', ext, re.I)
                  if m:
                      groups[m.group(1).strip()] += 1
                  else:
                      no_group += 1
          print("Food/cooking channels in Кулинария:", len(matched))
          print("False positives corrected:", len(corrected))
          print("Removed country channels:", len(removed_country))
          print("Removed country group breakdown:", dict(Counter(g for g, _ in removed_country)))
          print("Channels ungrouped from Разное:", ungrouped_misc)
          print("Total channels:", total)
          print("Total groups:", len(groups))
          print("Кулинария count:", groups["Кулинария"])
          print("Разное group count:", groups["Разное"])
          print("Ungrouped channel count:", no_group)
          assert groups["Разное"] == 0, "Разное group still exists"
          assert all(g.casefold() not in remove_groups for g in groups), "Country group remains"
          PY
      - name: Commit updated test playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist-test.m3u
          git commit -m "Remove requested groups from test playlist"
          git push origin candidate-26-review-2026-11-23
