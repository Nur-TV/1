name: Publish isolated test playlist
on:
  push:
    branches:
      - candidate-26-review-2026-11-23
    paths:
      - .github/workflows/publish-candidate-test.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate-26-review-2026-11-23
      - name: Download completed candidate artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/Nur-TV/1/actions/artifacts/14862579445/zip" -o /tmp/candidate.zip
          mkdir /tmp/candidate
          unzip -q /tmp/candidate.zip -d /tmp/candidate
      - name: Filter VOD and normalize groups to original structure
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          src=Path('/tmp/candidate/playlist-final-test.m3u')
          lines=src.read_text(encoding='utf-8-sig',errors='replace').splitlines()
          records=[]
          i=0
          while i<len(lines):
              if not lines[i].startswith('#EXTINF:'):
                  i+=1
                  continue
              block=[lines[i]]
              i+=1
              while i<len(lines) and lines[i].startswith('#'):
                  block.append(lines[i])
                  i+=1
              url=lines[i].strip() if i<len(lines) else ''
              if url:
                  i+=1
              records.append((block,url))
          base_count=2976
          canonical={
              'Разное','Региональные','Эфирные','Turon Media (VPN)','LLC G&G-Telecom',
              'Спорт','Турция','Uplink (VPN)','Кино и сериалы','Кинозалы 🍿 (VPN)',
              'Оргтехсервис (VPN)','Узбекистан','Будущее','Взрослые','Общественные',
              'Познавательные','Развлекательные','Велком','Наш Нет 🇺🇦','Детские',
              'Datacamp Limited','Казахстан','Армения','Новости','Досуг','Федеральные',
              'Беларусь','Сити Эдем','Грузия','Индия','Азербайджан','Туркменистан',
              'Религиозные','Мужские','Молдавия','Кыргызстан'
          }
          country={'uzbekistan':'Узбекистан','turkey':'Турция','kazakhstan':'Казахстан',
                   'armenia':'Армения','belarus':'Беларусь','georgia':'Грузия','india':'Индия',
                   'azerbaijan':'Азербайджан','turkmenistan':'Туркменистан','moldova':'Молдавия',
                   'молдова':'Молдавия','kyrgyzstan':'Кыргызстан','кыргызстан':'Кыргызстан'}
          cities=re.compile(r'^(москва|санкт.?петербург|екатеринбург|новосибирск|краснодар|челябинск|иркутск|омск|пермь|воронеж|казань|самара|уфа|тюмень|владивосток|хабаровск|абакан|архангельск|астрахань|барнаул|белгород|брянск|вологда|волгоград|владимир|калуга|калининград|кемерово|киров|кострома|курск|липецк|нижний новгород|оренбург|пенза|рязань|саратов|сургут|тверь|томск|тула|ульяновск|чита|ярославль|регионы|региональные)',re.I)
          patterns=[
              (re.compile(r'(adult|18\+|взросл)',re.I),'Взрослые'),
              (re.compile(r'(спорт|sport|match|матч|football|soccer|hockey|баскетбол)',re.I),'Спорт'),
              (re.compile(r'(дет|детск|kids|children|cartoon|карусел)',re.I),'Детские'),
              (re.compile(r'(новост|news)',re.I),'Новости'),
              (re.compile(r'(познав|истори|history|document|документ|природ|nature|science|наук|географ)',re.I),'Познавательные'),
              (re.compile(r'(религ|relig)',re.I),'Религиозные'),
              (re.compile(r'(регион|region|город|област|край)',re.I),'Региональные'),
              (re.compile(r'(кино|кинозал|film|movie|сериал)',re.I),'Кино и сериалы'),
              (re.compile(r'(развлек|шоу|юмор|комед|entertain|show|humor|music|музык|музыка|радио|radio|концерт|клипы|досуг|хобби)',re.I),'Развлекательные')
          ]
          kept=[]
          removed=Counter()
          remapped=Counter()
          remove_groups={
              "парад победы 1945 года",
              "удивительные люди",
              "на самом деле",
              "мужское - женское",
              "привет андрей",
              "пусть говорят с а.малаховым",
              "поле чудес",
              "концерты",
              "утренняя почта",
              "песня года",
              "старые песни о главном",
              "новый год и др",
              "аншлаг и компания",
              "юморина",
              "кривое зеркало",
              "юмор",
              "петросян-шоу",
              "что где когда",
              "вселенная",
              "детские фильмы и сказки",
              "фильмы-2",
              "radio record",
              "сити эдем",
              "cineman",
              "tv&films",
              "serialstream",
              "streamfree no 24/7",
              "мультstream взрослый от endik",
              "фильмовое",
              "dimonovich",
              "мультstream детский",
              "мультstream взрослый",
              "вечерний киноstream",
              "kinowalk production",
              "киностream hd",
              "киностream sd",
              "смотрим нтв",
              "оргтехсервис (vpn)",
              "uplink (vpn)"
          }
          def norm(s):
              return re.sub(r'[^а-яa-z0-9]+','',s.casefold().replace('ё','е'))
          remove_norm={norm(x) for x in remove_groups}
          removed_requested=Counter()
          for n,(block,url) in enumerate(records):
              extgrp_match=re.search(r'^#EXTGRP:([^\r\n]*)', '\n'.join(block), re.I|re.M)
              extgrp=extgrp_match.group(1).strip() if extgrp_match else ''
              m=re.search(r'group-title="([^"]*)"',block[0],re.I)
              group=extgrp or (m.group(1).strip() if m else '')
              if norm(group) == norm('Разное 🎭'):
                  block=[line for line in block if not line.startswith('#EXTGRP:')]
                  if re.search(r'group-title="[^"]*"',block[0],re.I):
                      block[0]=re.sub(r'group-title="[^"]*"', 'group-title="Разное"', block[0], count=1, flags=re.I)
                  else:
                      block[0]=block[0].replace(',', ' group-title="Разное",', 1)
                  remapped[group]+=1
                  kept.append((block,url))
                  continue
              if norm(group) in remove_norm:
                  removed_requested[group or '(без группы)']+=1
                  continue
              # Televizo reads EXTGRP as an independent category; strip it after filtering
              block=[line for line in block if not line.startswith('#EXTGRP:')]
              if n<base_count:
                  kept.append((block,url))
                  continue
              if 'hls-vod' in url.lower():
                  removed['hls-vod']+=1
                  continue
              if re.search(r'(кинозал|медиатек|фильм|мультфильм|сериал|movies|films|series|vod|on.?demand|ролики|боевик|триллер|комеди|ужас|драм|мелодрам|фантастик|приключен|4k\s*kino\s*zal|kino\s*zal|новинки\s+кино|русское\s+кино)',group,re.I):
                  removed[group]+=1
                  continue
              low=group.casefold()
              if group in canonical:
                  target=group
              elif low in country:
                  target=country[low]
              elif cities.search(group):
                  target='Региональные'
              else:
                  target=next((name for pattern,name in patterns if pattern.search(group)),'Разное')
              head,sep,title=block[0].partition(',')
              # Source records can contain broken quotes in group-title; remove that attribute tail entirely.
              pos=head.lower().find('group-title=')
              if pos>=0:
                  head=head[:pos].rstrip()
              pos=title.lower().find('group-title=')
              if pos>=0:
                  title=title[:pos].rstrip()
              block[0]=head+' group-title="'+target+'"'+(sep+title if sep else '')
              remapped[group or '(без группы)']+=1
              kept.append((block,url))
          out=Path('playlist-test.m3u')
          with out.open('w',encoding='utf-8',newline='') as f:
              for block,url in kept:
                  for line in block:
                      line=re.sub(r'#EXTGRP:[^\r\n]*','',line)
                      if line:
                          f.write(line+'\n')
                  if url:
                      f.write(url+'\n')
          groups=Counter()
          for block,url in kept:
              m=re.search(r'group-title="([^"]*)"',block[0],re.I)
              groups[m.group(1) if m else '(без группы)']+=1
          print(f'Input={len(records)} output={len(kept)} baseline={base_count} additions={len(kept)-base_count} removed={sum(removed.values())}')
          print('Final groups:',len(groups),dict(groups))
          print('Remapped source groups:',len(remapped))
          print('Removed requested groups:',dict(removed_requested), 'total=',sum(removed_requested.values()))
          print('Removed entries:',dict(removed))
          forbidden={norm(x) for x in remove_groups}
          assert len(records)>=base_count, 'Candidate unexpectedly smaller than original baseline'
          assert not any(norm(g) in forbidden for g in groups), 'A screenshot-listed group remains in output'
          assert not any(g.strip()!='Разное' and norm(g)==norm('Разное') for g in groups), 'Emoji Разное group remains separate'
          assert groups.get('Разное',0)>0, 'Plain Разное group unexpectedly missing'
          assert '#EXTGRP:' not in out.read_text(encoding='utf-8'), 'EXTGRP metadata remains and may create duplicate Televizo groups'
          assert all((lambda m: m and m.group(1) in canonical)(re.search(r'group-title="([^"]*)"',block[0],re.I)) for block,url in kept[base_count:]), 'Unexpected group names remain in imported records'
          PY
      - name: Commit test playlist to candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlist-test.m3u
          git commit -m "Normalize test playlist groups to original structure"
          git push origin candidate-26-review-2026-11-23
